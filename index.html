:var(--gold)}.nav button.active:before{content:"";position:absolute;top:-9px;height:2px;left:25%;right:25%;background:var(--gold)}.soon{font-size:8px;color:var(--muted);border-radius:20px;background:var(--panel2);padding:0 4px}.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#000a;padding:20px}.dialog{width:min(420px,100%);border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:20px;max-height:80vh;overflow-y:auto}.dialog h2{margin-bottom:14px}.formlabel{display:block;font-size:12px;margin:12px 0 4px;color:var(--muted)}.formfield{width:100%;padding:10px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:9px}.actionrow{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.toast{position:fixed;z-index:40;bottom:105px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 14px;border-radius:9px;font-size:12px;white-space:nowrap;box-shadow:0 7px 20px #0006}.hidden{display:none!important}.onlydemo{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:11px;padding:8px 12px;border-radius:9px;margin-bottom:20px} .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}.menupop{position:absolute;z-index:25;right:18px;top:72px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px;box-shadow:0 8px 20px #0007;min-width:170px}.menupop button{border:0;background:none;color:var(--txt);width:100%;text-align:left;padding:9px 10px;font-size:13px}.prefrow{display:flex;gap:9px;flex-wrap:wrap}.prefrow button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px}.prefrow button.selected{border-color:var(--gold);color:var(--gold)}

const statuses=['未着手','進行中','確認待ち','完了'];
const seed=[{id:1,title:'翌月の馬車当番の確認',status:'未着手',priority:'高',due:'2026-11-26',members:'TAKU・RIN'},{id:2,title:'新メンバーの承認手順を整理',status:'未着手',priority:'中',due:'2026-11-28',members:'YUI'},{id:3,title:'ギルド運営ルールの見直し',status:'進行中',priority:'中',due:'2026-12-02',members:'SORA・RIN'},{id:4,title:'翌月イベント準備',status:'確認待ち',priority:'高',due:'2026-11-30',members:'TAKU'},{id:5,title:'馬車案内文の更新',status:'完了',priority:'低',due:'2026-11-19',members:'YUI'}];
let tasks=seed.map(x=>({...x})),page='home',view='tasks',filter='未着手',year=2026,month=10,selected=21,modal=null,menu=false,role='officer',pref='auto';
const J=['日','月','火','水','木','金','土']; const names=['ミナ','レイ','カナ','ユウ','ハル','ソラ','リク','アオイ','シオ','カゼ','ノア','レン','タク','ミオ'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateInfo(y,m,d){const dt=new Date(y,m,d);return `${dt.getMonth()+1}月${dt.getDate()}日（${J[dt.getDay()]}）`;}
function fakeName(y,m,d){const seed=(y*13+m*5+d*7);return names[Math.abs(seed)%names.length]}
function applyTheme(){const dark=pref==='auto'?matchMedia('(prefers-color-scheme: dark)').matches:pref==='dark';document.documentElement.dataset.theme=dark?'dark':'light'}
function head(){return `<header class="sitehead"><div class="brand"><img alt="オウマガトキのエンブレム" src="${CREST}"><div class="brandwords"><div class="brandname">オウマガトキ</div><div class="en">GUILD PORTAL</div></div><div class="headtools"><button class="iconbtn" aria-label="設定" onclick="openSettings()">⚙</button><button class="iconbtn" aria-label="メニュー" onclick="toggleMenu()">☰</button></div></div>${menu?`<div class="menupop"><button onclick="openSettings()">表示設定</button><button onclick="setRole()">プレビューの権限切替</button></div>`:''}</header>`}
function nav(){const items=[['home','⌂','HOME'],['news','♧','お知らせ'],['carriage','▦','馬車'],['survey','☷','アンケート']];if(role==='officer')items.push(['officer','♜','幹部']);return `<nav class="nav" aria-label="画面ナビゲーション">${items.map(([id,icon,t])=>`<button aria-label="${t}" class="${page===id?'active':''} ${id==='officer'?'officer':''}" onclick="go('${id}')"><span class="navico">${icon}</span><span>${t}</span>${['news','survey'].includes(id)?'<span class="soon">準備中</span>':''}</button>`).join('')}</nav>`}
function home(){return `<div class="section welcome"><div class="eyebrow">HOME</div><h1>ようこそ、オウマガトキへ</h1><p>ギルドの情報をここから確認できます。</p></div><section class="section"><button class="linkcard wagon" onclick="go('carriage')"><div><div class="label">ギルド馬車</div><div class="sub en">GUILD CARRIAGE</div></div><span class="chev">›</span></button>${role==='officer'?`<button class="linkcard office" onclick="go('officer')"><div><div class="label">幹部ワークスペース</div><div class="sub en">OFFICER WORKSPACE</div></div><span class="chev">›</span></button>`:''}<div class="onlydemo">デザイン確認用プロトタイプ：当番・タスクはサンプルデータです。</div></section>`}
function calendar(){const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),rows=Math.ceil((first+days)/7);let cells='';for(let i=0;i<rows*7;i++){const d=i-first+1,date=new Date(year,month,d),isout=d<1||d>days,wd=date.getDay(),dd=date.getDate(),who=!isout?fakeName(year,month,d):'',off=!isout&&d%7===0;cells+=`<button class="day ${wd===0?'sun':''} ${wd===6?'sat':''} ${isout?'out':''} ${d===selected&&!isout?'sel':''}" ${isout?'disabled':''} onclick="pickDay(${d})"><span class="daynum">${dd}</span>${!isout?`<span class="namechip ${off?'officerchip':''}">${off?'♛ ':''}${who}</span>`:''}</button>`}
return `<div class="pageheadline"><h1>ギルド馬車</h1><div class="en">GUILD CARRIAGE</div></div><section class="section"><div class="monthbar"><button onclick="changeMonth(-1)" aria-label="前の月">‹ 前月</button><strong class="numeric">${year}年${month+1}月</strong><button onclick="changeMonth(1)" aria-label="次の月">次月 ›</button></div><div class="calbox"><div class="calendar">${J.map((x,i)=>`<div class="weekday ${i===0?'sun':i===6?'sat':''}">${x}</div>`).join('')}${cells}</div></div><div class="legend"><span>■ 一般メンバー</span><span><b>♛</b> 幹部表示（サンプル）</span></div><div class="selection"><div><div class="note">選択中の日付</div><strong>${dateInfo(year,month,selected)}</strong><div>${esc(fakeName(year,month,selected))}${selected%7===0?'　♛ 幹部':''}</div></div><span style="color:var(--gold);font-size:24px">▦</span></div><p class="note" style="margin-top:13px">当番の更新は既存Googleスプレッドシートで行います。現在の表示は仮データです。</p></section>`}
function count(st){return tasks.filter(t=>t.status===st).length}
function officer(){return `<div class="pageheadline"><h1>幹部ワークスペース</h1><div class="en">OFFICER WORKSPACE</div></div><section class="section"><div class="tabs">${[['tasks','タスク管理'],['manual','マニュアル'],['decisions','決定事項']].map(([id,t])=>`<button class="${view===id?'current':''}" onclick="setView('${id}')">${t}</button>`).join('')}</div>${view==='tasks'?`<div class="metrics">${statuses.map(s=>`<div class="metric"><span>${s}</span><strong>${count(s)}</strong></div>`).join('')}</div><div class="statusbar"><h2>タスク</h2><button class="primarybtn" onclick="addTask()">＋ 追加</button></div><div class="tabs">${statuses.map(s=>`<button class="${filter===s?'current':''}" onclick="setFilter('${s}')">${s} (${count(s)})</button>`).join('')}</div><div>${tasks.filter(x=>x.status===filter).map(t=>`<article class="taskcard"><div class="top"><h3>${esc(t.title)}</h3><span class="pill">${esc(t.priority)}</span></div><p>担当：${esc(t.members)}　｜　期限：${esc(t.due)}</p><div class="taskactions"><button class="smallbtn" onclick="editTask(${t.id})">詳細・編集</button><button class="outlinebtn" onclick="advance(${t.id})">次の状態へ ›</button></div></article>`).join('')||'<div class="empty">このステータスのタスクはありません。</div>'}</div>`:view==='manual'?docs('manual'):docs('decisions')}</section>`}
const docsData={manual:[['馬車当番の確認方法','スプレッドシートで編集し、サイトは閲覧専用です。'],['新規メンバーの登録手順','ゲーム内DMで本人確認後、管理担当が承認します。']],decisions:[['11月の運営方針','既存GASを維持してポータルは閲覧専用にする。'],['権限の取り扱い','サイト全体の変更はサイト管理者だけが行う。']]};
function docs(type){return `<div class="statusbar"><h2>${type==='manual'?'マニュアル':'決定事項'}</h2><button class="primarybtn" onclick="editDoc('${type}',-1)">＋ 作成</button></div><p class="note" style="margin-bottom:12px">この画面内の変更は保存されません（試作用）。</p>${docsData[type].map((d,i)=>`<div class="doccard"><strong>${esc(d[0])}</strong><p>${esc(d[1])}</p><button class="smallbtn" style="margin-top:10px" onclick="editDoc('${type}',${i})">編集</button></div>`).join('')}`}
function coming(){return `<div class="pageheadline"><h1>${page==='news'?'お知らせ':'アンケート'}</h1></div><section class="section"><div class="doccard" style="text-align:center;padding:50px 20px"><h2>準備中</h2><p class="muted" style="margin-top:12px">こちらの機能は今後追加される予定です。</p><button class="outlinebtn" onclick="go('home')" style="margin-top:23px">HOMEへ戻る</button></div></section>`}
function render(){applyTheme();document.getElementById('app').innerHTML=head()+(page==='home'?home():page==='carriage'?calendar():page==='officer'&&role==='officer'?officer():coming())+nav()+(modal?dialog():'')}
function go(p){if(p==='officer'&&role!=='officer')return;page=p;menu=false;render();scrollTo({top:0,behavior:'smooth'})}function setView(v){view=v;render()}function setFilter(v){filter=v;render()}function pickDay(d){selected=d;render()}function changeMonth(n){const dt=new Date(year,month+n,1);year=dt.getFullYear();month=dt.getMonth();selected=1;render()}function toggleMenu(){menu=!menu;render()}function setRole(){role=role==='officer'?'member':'officer';page='home';menu=false;render()}
function toast(txt){let el=document.createElement('div');el.className='toast';el.textContent=txt;document.body.append(el);setTimeout(()=>el.remove(),2500)}
function addTask(){modal={type:'task',id:null};render()}function editTask(id){modal={type:'task',id};render()}function editDoc(type,i){modal={type:'doc',kind:type,i};render()}function openSettings(){menu=false;modal={type:'settings'};render()}function closeModal(){modal=null;render()}
function dialog(){if(modal.type==='settings')return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="dialog"><h2>表示設定</h2><p class="note" style="margin-bottom:12px">テーマを切り替えられます。</p><div class="prefrow">${[['auto','端末設定'],['dark','ダーク'],['light','ライト']].map(([x,t])=>`<button class="${pref===x?'selected':''}" onclick="setTheme('${x}')">${t}</button>`).join('')}</div><p class="note" style="margin-top:20px">プレビュー用：一般メンバーと幹部の表示を切り替えられます。</p><button class="outlinebtn" style="margin-top:8px" onclick="setRole();closeModal()">現在：${role==='officer'?'幹部':'一般メンバー'} → 切替</button><div class="actionrow"><button class="primarybtn" onclick="closeModal()">閉じる</button></div></div></div>`;
if(modal.type==='doc'){const d=docsData[modal.kind][modal.i]||['',''];return `<div class="overlay" onclick="if(event.target===this)closeModal()"><form class="dialog" onsubmit="saveDoc(event)"><h2>${modal.i<0?'新規作成':'編集'}｜${modal.kind==='manual'?'マニュアル':'決定事項'}</h2><label class="formlabel">タイトル</label><input required name="title" maxlength="80" class="formfield" value="${esc(d[0])}"><label class="formlabel">内容</label><textarea name="body" rows="6" class="formfield">${esc(d[1])}</textarea><div class="actionrow"><button type="button" class="smallbtn" onclick="closeModal()">キャンセル</button><button class="primarybtn">保存（仮）</button></div></form></div></div>`}
const t=tasks.find(x=>x.id===modal.id)||{title:'',status:'未着手',priority:'中',members:'',due:'2026-11-30'};return `<div class="overlay" onclick="if(event.target===this)closeModal()"><form class="dialog" onsubmit="saveTask(event)"><h2>${modal.id?'タスクの編集':'新しいタスク'}</h2><label class="formlabel">タスク名</label><input name="title" required maxlength="100" class="formfield" value="${esc(t.title)}"><label class="formlabel">担当者</label><input name="members" class="formfield" value="${esc(t.members)}" placeholder="例：RIN・TAKU"><label class="formlabel">期限</label><input name="due" type="date" class="formfield" value="${esc(t.due)}"><label class="formlabel">優先度</label><select name="priority" class="formfield">${['高','中','低'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select><label class="formlabel">ステータス</label><select name="status" class="formfield">${statuses.map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select><div class="actionrow"><button type="button" class="smallbtn" onclick="closeModal()">キャンセル</button><button class="primarybtn">保存（仮）</button></div></form></div></div>`}
function setTheme(x){pref=x;render()}function saveTask(e){e.preventDefault();const fd=new FormData(e.currentTarget),obj=Object.fromEntries(fd.entries());if(modal.id){Object.assign(tasks.find(x=>x.id===modal.id),obj)}else{tasks.push({...obj,id:Date.now()})}modal=null;filter=obj.status;render();toast('プロトタイプ内で更新しました（再読み込みでリセット）')}
function saveDoc(e){e.preventDefault();const fd=new FormData(e.currentTarget),d=[fd.get('title'),fd.get('body')];if(modal.i<0)docsData[modal.kind].push(d);else docsData[modal.kind][modal.i]=d;modal=null;render();toast('プロトタイプ内で更新しました')}
function advance(id){let t=tasks.find(x=>x.id===id);t.status=statuses[(statuses.indexOf(t.status)+1)%4];render();toast('タスクのステータスを変更しました')}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>pref==='auto'&&render());render();
</script></body></html>
