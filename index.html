/* OUMAGATOKI GUILD PORTAL v2.2 — approved designs, adapted to the latest UI specification. */
:root{
  --bg:#11161c;--panel:#20262c;--panel2:#2a3036;--text:#f1e9de;--muted:#b6b0a9;
  --gold:#d8af70;--line:rgba(216,175,112,.3);--danger:#ce7974;
  --v22-gold-soft:#8d734e;--v22-ink:#10161c;--v22-shadow:0 9px 24px rgba(0,0,0,.23)
}
:root[data-theme=light]{
  --bg:#f2eee7;--panel:#fffcf6;--panel2:#ece5d8;--text:#292b2d;--muted:#62676a;
  --gold:#805d2f;--line:rgba(102,76,44,.3);--danger:#a84747;
  --v22-gold-soft:#99784a;--v22-ink:#182029;--v22-shadow:0 8px 24px rgba(30,27,24,.1)
}
body{background:#0b0e13;color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.app{background-color:var(--bg);background-image:radial-gradient(ellipse at 70% 10%,rgba(147,115,69,.08),transparent 48%),linear-gradient(140deg,transparent 65%,rgba(7,10,13,.1) 100%);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.header{height:78px;padding:9px 16px;gap:12px;background:linear-gradient(90deg,rgba(15,20,25,.98),rgba(32,34,34,.98));border-bottom:1px solid rgba(216,175,112,.35);box-shadow:0 3px 22px rgba(0,0,0,.24)}
.crest{width:43px;height:55px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))}
.brand{font-size:17px;font-weight:500;letter-spacing:.02em}
.brand small{font-family:Georgia,"Times New Roman",serif;font-size:11px;letter-spacing:.2em;color:#d8af70;margin-top:2px}
.menu-toggle{width:44px;height:44px;flex:none;background:rgba(12,14,16,.5);border:1px solid rgba(216,175,112,.4);color:#e6c795}
.menu{z-index:60;top:72px;border-radius:10px}
.menu button{min-height:44px}
.hero{min-height:133px;margin:0 0 17px;padding:20px 19px 19px;border:0;border-radius:0;border-bottom:1px solid rgba(216,175,112,.36);background-color:#141b21;background-image:linear-gradient(90deg,rgba(10,15,20,.97) 0%,rgba(11,17,22,.73) 48%,rgba(11,16,20,.28) 100%),var(--hero-photo);background-size:cover,cover;background-position:center,center 68%;box-shadow:inset 0 -20px 28px rgba(12,16,20,.28);align-items:flex-end}
.hero--home{min-height:168px;background-position:center,center 71%}
.hero--carriage{min-height:146px;background-image:linear-gradient(90deg,rgba(10,15,20,.92),rgba(10,15,20,.46) 54%,rgba(10,15,20,.15)),var(--hero-photo);background-size:cover,145% auto;background-position:center,center 58%}
.hero--officer{min-height:135px;background-position:center,75% 68%}
.hero--plain{min-height:100px;background-position:center,center 73%}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#10181f 0%,#10181f 32%,rgba(16,24,31,.98) 48%,rgba(16,24,31,.12) 88%)}
.hero--carriage::before{background:linear-gradient(90deg,rgba(16,24,31,.84) 0%,rgba(16,24,31,.47) 42%,transparent 94%)}
.hero__copy{position:relative;z-index:1;max-width:100%}
.hero__eyebrow{display:block;color:#ddba81;font-size:10px;letter-spacing:.19em;margin-bottom:6px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.hero h1{font-size:21px;font-weight:500;line-height:1.47;letter-spacing:.02em;color:#f6eddf;text-shadow:0 2px 7px rgba(0,0,0,.75)}
.hero--home h1{font-size:21px}
.content{padding:0 15px 28px}
.label-row{margin:13px 0 11px}
.label-row h2{font-size:16px;font-weight:500;letter-spacing:.04em}
.section-accent{color:var(--gold);font-size:10px;letter-spacing:.16em;opacity:.8}
/* Image-led links retain the approved tactical / warm-gold aesthetic. */
.feature{height:123px;border:1px solid var(--v22-gold-soft);border-radius:13px;margin-bottom:13px;padding:16px 19px;box-shadow:inset 0 0 0 2px rgba(219,183,119,.08),var(--v22-shadow);background:#141c21;color:#f2e9da;isolation:isolate}
.feature::before{inset:0 0 0 23%;background-image:var(--photo);background-size:cover;background-position:center 53%;opacity:.9;z-index:-2}
.feature::after{inset:0;background:linear-gradient(90deg,#111920 0%,rgba(17,25,32,.95) 33%,rgba(17,25,32,.44) 71%,rgba(17,25,32,.85) 100%);z-index:-1}
.feature__copy{display:block;position:relative;z-index:1;max-width:calc(100% - 40px)}
.feature strong{font-size:18px;font-weight:500;color:#f4e9d9;letter-spacing:.015em;line-height:1.55;text-shadow:0 2px 5px #000}
.feature .kicker{font-size:10px;letter-spacing:.15em;color:#d6b17a;margin-top:4px}
.feature__arrow,.workspace-entry__chevron{margin-left:auto;display:grid;place-items:center;z-index:2;flex:none;width:32px;height:36px;color:#dfc396;background:rgba(12,17,22,.72);border-radius:8px}
.feature__arrow svg,.workspace-entry__chevron svg{height:21px;width:21px}
.feature--news{height:91px;margin-top:9px}
.feature--news::before{background-position:center 77%;background-size:cover}
.feature--news::after{background:linear-gradient(90deg,#141c23 0%,rgba(20,28,35,.94) 46%,rgba(20,28,35,.35) 100%)}
.feature--carriage::before{background-position:55% 56%}
.feature--officer::before{background-position:55% 55%}
.feature:focus-visible,.workspace-entry:focus-visible{outline:2px solid #e6c487;outline-offset:3px}
.notice{border-color:var(--line);border-radius:10px;background:var(--panel);margin-bottom:9px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.notice-button{min-height:58px;padding:12px 14px}
.notice-title{font-size:14px;font-weight:500}
.notice-content{font-size:14px;line-height:1.75}
.notice-meta{font-size:11px}
/* Distinct and accurate symbols in a usable fixed navigation. */
.bottom{background:linear-gradient(180deg,rgba(25,30,34,.98),rgba(10,14,17,.99));border-top:1px solid rgba(216,175,112,.43);padding:7px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -6px 25px rgba(0,0,0,.22)}
.bottom button{min-height:65px;gap:3px;color:#b7b4af;font-size:11px;border-right:1px solid rgba(216,175,112,.12)}
.bottom button:last-child{border-right:0}
.bottom .ico{display:grid;place-items:center;width:27px;height:27px}
.bottom .ico svg{width:25px;height:25px;stroke-width:1.8}
.bottom button.active{background:linear-gradient(180deg,rgba(218,174,109,.16),rgba(218,174,109,.02));color:#edcb94}
.bottom button.active::before{top:-8px;height:2px;width:70%;background:#e2b77a;box-shadow:0 0 10px rgba(234,182,92,.52)}
.bottom button.officer{border-radius:7px;background:rgba(210,169,104,.08)}
.bottom button.officer.active{background:linear-gradient(180deg,rgba(157,110,55,.47),rgba(157,110,55,.12));color:#f2cf98}
.bottom em{font-size:8px;line-height:1.1;position:absolute;top:1px;right:2px;border-radius:7px;background:rgba(40,44,46,.95);padding:1px 3px;color:#d8d0c5}
/* Carriage calendar — Monday start like the approved reference, with readable labels. */
.content--calendar{padding-top:0}
.month{margin:3px 0 15px;gap:12px}
.month strong{font-family:Georgia,"Times New Roman",serif;font-size:26px;font-weight:400;letter-spacing:.15em;color:var(--text);white-space:nowrap}
.month button{width:45px;height:45px;flex:none;display:grid;place-items:center;padding:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font:29px Georgia,serif;line-height:1;color:var(--gold)}
.calendar{border:1px solid var(--line);border-radius:10px;box-shadow:var(--v22-shadow);background:var(--panel)}
.weekday{padding:10px 0;font-size:14px;font-weight:500;color:var(--text);border-right:1px solid var(--line);background:var(--panel2)}
.weekday:nth-child(7){border-right:0}
.weekday.sat,.day.sat{background-color:rgba(71,94,121,.27)}
.weekday.sun,.day.sun{background-color:rgba(127,64,59,.29)}
.weekday.sat,.day.sat .date{color:#a3bdd5}
.weekday.sun,.day.sun .date{color:#e2a19b}
.day{height:auto;min-height:78px;padding:6px 3px 7px;border-color:var(--line);position:relative}
.day .date{font-family:Georgia,"Times New Roman",serif;font-size:16px;padding-left:3px;line-height:1.2;color:var(--text)}
.day .who{font-size:11px;font-weight:500;line-height:1.3;margin-top:9px;padding:5px 1px;min-height:26px;border:1px solid rgba(216,175,112,.17);border-radius:6px;background:rgba(15,19,23,.35);color:var(--text);overflow-wrap:anywhere}
.day .who.leader{color:var(--gold)}
.day.out{opacity:.35}
.day.today{z-index:1;box-shadow:inset 0 0 0 2px #dfb977,inset 0 0 14px rgba(217,163,83,.22);background-image:linear-gradient(rgba(216,175,112,.12),rgba(216,175,112,.12))}
.legend{gap:13px;flex-wrap:wrap;font-size:11px;align-items:center;margin-top:12px}
.legend>span{display:inline-flex;align-items:center;gap:5px}
.legend-dot{display:inline-block;width:8px;height:8px;border:1px solid var(--line);background:var(--panel2);border-radius:3px}
.legend-dot--leader{background:#ab8659}
/* Officer entry view recreates the approved image-led three-card hierarchy. */

.workspace-entry__art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#11181d 0%,rgba(17,24,29,.96) 32%,rgba(17,24,29,.55) 66%,rgba(17,24,29,.6) 81%,rgba(17,24,29,.95) 96%)}
.workspace-entry--tasks{height:240px}
.workspace-entry--tasks .workspace-entry__art{bottom:auto;height:143px;background-position:right 30%}
.workspace-entry--tasks .workspace-entry__art::after{background:linear-gradient(90deg,#11181d 0%,rgba(17,24,29,.91) 41%,rgba(17,24,29,.45) 75%,rgba(17,24,29,.96) 97%)}
.workspace-entry--manual .workspace-entry__art{background-position:right 56%}
.workspace-entry--decisions .workspace-entry__art{background-position:right 72%}
.workspace-entry__heading{display:flex;align-items:center;position:absolute;z-index:2;left:17px;top:28px;gap:13px;max-width:calc(100% - 75px)}
.workspace-entry__icon{width:34px;height:34px;flex:none;display:grid;place-items:center;color:#dcc293}
.workspace-entry__icon svg{width:33px;height:33px}
.workspace-entry__heading strong{display:block;font-size:20px;font-weight:500;line-height:1.3;letter-spacing:.02em;text-shadow:0 2px 7px #000}
.workspace-entry__heading small{display:block;font-size:10px;color:#d8b980;letter-spacing:.16em;margin-top:7px}
.workspace-entry__chevron{position:absolute;right:12px;top:27px}
.work-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;position:absolute;bottom:12px;left:12px;right:12px;z-index:2}
.work-stat{min-width:0;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;border:1px solid rgba(220,210,194,.2);border-radius:9px;background:linear-gradient(135deg,#34383d,#242930);color:#d4d9de;box-shadow:inset 3px 0 #89939d}
.work-stat--1{background:linear-gradient(135deg,#293d51,#202c3b);box-shadow:inset 3px 0 #648baa}
.work-stat--2{background:linear-gradient(135deg,#51412e,#2c2823);box-shadow:inset 3px 0 #d2a666}
.work-stat--3{background:linear-gradient(135deg,#31483c,#252f2a);box-shadow:inset 3px 0 #81a186}
.work-stat span{font-size:10px;white-space:nowrap}
.work-stat strong{font-size:26px;font-weight:400;line-height:1.05;color:#f6eee4}
.content--officer-detail .back-to-officer{min-height:44px;padding:8px 11px 9px;margin:0 0 12px;border:1px solid var(--line);border-radius:9px;color:var(--gold);background:var(--panel);font-size:12px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:12px 0 18px}
.metric{min-width:0;min-height:72px;padding:7px 2px;border:1px solid var(--line);color:var(--text);background:var(--panel);cursor:pointer}
.metric--0{border-top:3px solid #929a9f}.metric--1{border-top:3px solid #5c84ac}.metric--2{border-top:3px solid #caa16b}.metric--3{border-top:3px solid #85a287}
.metric.is-selected{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--gold)}
.metric span{font-size:10px;font-weight:500;color:var(--text)}
.metric b{font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:400}
.task-actions{display:flex;gap:7px}
.task-card{min-height:87px;border-radius:10px;padding:15px;border-color:var(--line);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.task-card strong{font-size:14px}
.doc-card{border-color:var(--line);min-height:70px}
/* Form / overlay comfort and light-mode differentiation. */
.modal{border-color:var(--line);box-shadow:0 12px 40px rgba(0,0,0,.38);padding:18px;max-height:calc(100dvh - 38px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.modal-head button,.mini,.goldbtn,.danger{min-height:42px}
.mini,.goldbtn{font-size:12px}
.checkbox-label{display:flex;align-items:center;gap:9px;min-height:34px;color:var(--text)}
.checkbox-label input{width:19px;height:19px;flex:none;accent-color:var(--gold)}
.formlabel{font-size:12px}
.field{min-height:43px;font-size:14px}
.upload-label input{min-height:38px}
.demo-note{font-size:11px;line-height:1.6;margin-top:18px}
:root[data-theme=light] .bottom{background:linear-gradient(180deg,#fff9ee,#eae1d3)}
:root[data-theme=light] .bottom button{color:#5c5b5a}
:root[data-theme=light] .bottom button.active{color:#805d2f;background:rgba(178,125,57,.12)}
:root[data-theme=light] .bottom button.officer{color:#805d2f}
:root[data-theme=light] .day .who{background:rgba(255,255,255,.55)}
:root[data-theme=light] .day.sat{background-color:rgba(130,159,183,.17)}
:root[data-theme=light] .day.sun{background-color:rgba(191,116,107,.16)}
:root[data-theme=light] .day.sat .date{color:#536f8b}
:root[data-theme=light] .day.sun .date{color:#a45751}
:root[data-theme=light] .work-stat{color:#f4f0eb}
:root[data-theme=light] .feature,:root[data-theme=light] .workspace-entry{color:#f5eee3}
@media(max-width:380px){
 .content{padding-left:11px;padding-right:11px}
 .hero{padding:16px 15px}
 .hero h1{font-size:19px}
 .feature{height:115px;padding:14px 15px}
 .feature--news{height:85px}
 .feature strong{font-size:16px}
 .workspace-entry__heading strong{font-size:18px}
 .workspace-entry__heading{left:13px;gap:8px}
 .workspace-entry__icon,.workspace-entry__icon svg{width:29px;height:29px}
 .month strong{font-size:24px}
 .day{min-height:74px;padding:4px 2px 5px}
 .day .date{font-size:14px}
 .day .who{font-size:10px;padding:4px 0;margin-top:8px;min-height:25px}
 .work-stats{gap:4px;left:9px;right:9px}
 .work-stat span{font-size:9px}
 .work-stat strong{font-size:24px}
 .bottom button{font-size:10px}
}
@media(prefers-reduced-motion:no-preference){.feature,.workspace-entry,.task-card{transition:border-color .18s ease,transform .18s ease}.feature:active,.workspace-entry:active{transform:scale(.992)}}

/* v2.3: HTML controls over one uninterrupted atmospheric scene. */
.app{
 --page-photo: none;
 background-color:var(--bg);
 background-image:linear-gradient(180deg,rgba(8,12,16,.12) 0%,rgba(9,14,18,.2) 180px,rgba(12,17,22,.38) 360px,rgba(12,17,22,.78) 600px,var(--bg) 860px),var(--page-photo);
 background-size:100% 100%,100% auto;
 background-position:top center,center top;
 background-repeat:no-repeat;
}
.app[data-page="carriage"]{
 background-image:linear-gradient(180deg,rgba(7,10,14,.23) 0%,rgba(8,12,16,.4) 185px,rgba(10,15,19,.75) 310px,var(--bg) 590px),var(--page-photo);
 background-size:100% 100%,100% 300px;
 background-position:top center,center 20px;
}
.app[data-page="officer"]{
 background-image:linear-gradient(180deg,rgba(8,12,16,.17) 0%,rgba(8,12,16,.34) 170px,rgba(10,14,19,.63) 400px,var(--bg) 790px),var(--page-photo);
 background-size:100% 100%,100% auto;
 background-position:top center,center top;
}
.app[data-page="news"],.app[data-page="survey"]{background-image:linear-gradient(180deg,rgba(8,12,16,.25),rgba(12,17,22,.92) 450px,var(--bg) 780px),var(--page-photo)}
.header{height:76px;background:linear-gradient(180deg,rgba(9,13,17,.76),rgba(9,13,17,.08));box-shadow:none;border-bottom:0;position:relative;z-index:10}
.header .brand{color:#f4e9d8;text-shadow:0 2px 6px #000}
.header-menu-controls{position:relative;flex:none}
.header .menu{top:50px;right:0}
.menu{background:rgba(28,34,39,.98);backdrop-filter:blur(12px);z-index:70}
.hero.hero--seamless{position:relative;min-height:144px;margin:0;padding:24px 17px 18px;display:flex;align-items:flex-end;background:transparent!important;box-shadow:none;border:0;border-radius:0;overflow:visible}
.hero.hero--seamless::before{display:none}
.hero--seamless .hero__copy{display:flex;align-items:center;gap:13px;padding:0;max-width:100%}
.hero--seamless .hero__symbol{width:42px;height:42px;display:grid;place-items:center;color:#e2c18a;filter:drop-shadow(0 2px 8px #000)}
.hero--seamless .hero__symbol svg{width:37px;height:37px}
.hero--seamless .hero__eyebrow{font-size:11px;letter-spacing:.17em;margin:3px 0 0;color:#dfbe89}
.hero--seamless h1{font-size:23px;line-height:1.42;color:#f5e9d7}
.content{background:transparent}
.content--calendar{padding-top:0}
.content--officer{padding-top:8px}
/* The HOME identity now replaces the compact header. */
.home-stage{position:relative;min-height:416px;display:flex;justify-content:center;align-items:center;text-align:center;padding:68px 19px 36px}
.home-stage__center{position:relative;z-index:1;display:flex;align-items:center;flex-direction:column;gap:0;width:100%;max-width:460px}
.home-stage__crest{width:100px;height:111px;object-fit:contain;filter:drop-shadow(0 8px 13px rgba(0,0,0,.6))}
.home-stage__title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(29px,7.5vw,39px);font-weight:400;letter-spacing:.065em;line-height:1.18;color:#edc591;text-shadow:0 3px 10px #000;margin:19px 0 15px}
.home-stage__subtitle{font-size:12px;font-weight:500;letter-spacing:.07em;color:#e4bf89;text-shadow:0 2px 8px #000}
.home-menu-controls{position:absolute;right:17px;top:calc(14px + env(safe-area-inset-top));z-index:40}
.home-menu-controls .menu-toggle{background:rgba(10,14,17,.45);border:1px solid rgba(210,174,119,.35);border-radius:7px;width:45px;height:45px}
.home-menu-controls .menu{top:51px;right:0}
.app[data-page=home] .content--home{position:relative;z-index:1}
.app[data-page=home] .content--home .label-row{margin-top:0}
/* Generated standalone paintings used on visually rich cards. */
.feature::before{background-position:center 50%;opacity:.96}
.feature--carriage::before{inset:0 0 0 26%;background-position:center}
.feature--officer::before{background-position:62% 52%}
.feature--news::before{background-position:60% 52%}
.workspace-entry{box-shadow:inset 0 0 0 1px rgba(232,193,135,.18),0 10px 27px rgba(0,0,0,.25)}
/* Long names remain legible in seven columns without expanding individual rows. */
.day{height:80px;min-height:80px;overflow:hidden;padding:5px 2px 5px}
.day .who{appearance:none;-webkit-appearance:none;width:100%;display:block;min-width:0;margin-top:7px;min-height:40px;max-height:44px;padding:3px 1px;white-space:normal;text-align:center;cursor:pointer;color:var(--text);line-height:1.2;border-radius:5px;font-size:10px;font-weight:500;overflow:hidden}
.day .who-text{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;word-break:break-all;max-width:100%;line-height:1.28;max-height:2.56em}
.day .who:focus-visible{outline:2px solid #efc17f;outline-offset:-1px}
.calendar-help{color:var(--muted);font-size:11px;line-height:1.6;margin:12px 0 2px}
.carriage-person-name{font-size:19px;line-height:1.6;overflow-wrap:anywhere;color:var(--text);margin:13px 0}
.carriage-person-date{font-size:13px;color:var(--gold);letter-spacing:.14em}
/* The light theme retains legible controls; visual scene remains a cinematic banner at top. */
:root[data-theme=light] .app{background-image:linear-gradient(180deg,rgba(8,12,16,.22) 0%,rgba(8,12,16,.3) 180px,rgba(242,238,231,.33) 420px,var(--bg) 720px),var(--page-photo)}
:root[data-theme=light] .app[data-page=carriage]{background-image:linear-gradient(180deg,rgba(8,12,16,.30) 0%,rgba(8,12,16,.43) 165px,rgba(242,238,231,.64) 310px,var(--bg) 590px),var(--page-photo)}
:root[data-theme=light] .hero--seamless h1{color:#fff5e8}
:root[data-theme=light] .app[data-page=home] .content--home .label-row h2{color:var(--text)}
@media(max-width:360px){
 .home-stage{min-height:389px;padding-top:60px}
 .home-stage__crest{width:88px;height:101px}
 .home-stage__title{font-size:29px}
 .hero.hero--seamless{min-height:129px;padding:18px 12px 15px}
 .hero--seamless h1{font-size:20px}
 .day{height:76px;min-height:76px}
 .day .who{font-size:9px;min-height:38px;max-height:41px}
}

/* v2.4 – layout refinement against user-approved three-phone design (2026-11-22).
   Append after v2.3.css; preserve existing functional controls and demo data. */
:root{--v24-gold:#dfb87e;--v24-gold-light:#e7c994;--v24-ornament:rgba(222,184,126,.66)}
/* Continuous scene from identity/header through the bottom of the view. */
.app{
  background-image:linear-gradient(180deg,rgba(7,11,15,.12) 0%,rgba(7,11,15,.23) 230px,rgba(8,12,16,.53) 470px,rgba(8,12,16,.80) 840px,rgba(8,12,16,.88) 100%),var(--page-photo);
  background-size:100% 100%,100% auto;
  background-position:center top,center top;
  background-repeat:no-repeat;
}
.app[data-page=carriage]{
  background-image:linear-gradient(180deg,rgba(9,13,17,.16) 0%,rgba(9,13,17,.36) 195px,rgba(10,15,19,.70) 315px,rgba(12,16,20,.84) 760px,var(--bg) 1100px),var(--page-photo);
  background-size:100% 100%,auto 308px;
  background-position:center top,58% 24px;
}
.app[data-page=officer]{
  background-image:linear-gradient(180deg,rgba(9,13,17,.17) 0%,rgba(9,13,17,.20) 240px,rgba(9,13,17,.62) 470px,rgba(10,15,19,.78) 840px,var(--bg) 1250px),var(--page-photo);
  background-size:100% 100%,100% auto;
  background-position:center top,center top;
}
/* Blend header into illustration: no separate header panel or line. */
.header{height:72px;padding:8px 15px;background:linear-gradient(180deg,rgba(9,13,17,.55),rgba(9,13,17,0));border:0}
.header .crest{width:39px;height:53px}
.header .brand{font-size:16px}
.header .brand small{font-size:10px}
.menu-toggle{border-radius:6px;background:rgba(8,12,15,.50);border:1px solid rgba(215,179,121,.28)}
/* HOME uses the requested centered identity and menu, not the common header. */
.home-stage{min-height:345px;padding:52px 18px 31px;align-items:center}
.home-stage__crest{width:93px;height:109px}
.home-stage__title{font-size:clamp(28px,7.2vw,37px);letter-spacing:.047em;line-height:1.13;margin:16px 0 12px;color:#edc08a}
.home-stage__subtitle{font-size:12px;letter-spacing:.06em;color:#e2b984}
.home-stage__ornament{display:flex;align-items:center;justify-content:center;gap:8px;width:172px;margin-top:18px;height:10px}
.home-stage__ornament::before,.home-stage__ornament::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#deae67)}
.home-stage__ornament::after{transform:scaleX(-1)}
.home-stage__ornament i{display:block;width:7px;height:7px;border:1px solid #e3bc80;transform:rotate(45deg);box-shadow:0 0 8px rgba(224,164,82,.3)}
.home-menu-controls{top:calc(14px + env(safe-area-inset-top));right:16px}
.home-menu-controls .menu-toggle{width:42px;height:42px}
.app[data-page=home] .content--home{padding:0 14px 25px}
/* Feature cards above notices, like user-supplied reference. */
.content--home .feature{height:119px;margin-bottom:13px;padding:13px 17px;border-radius:12px;border:1px solid rgba(226,182,114,.72);box-shadow:inset 0 0 0 1px rgba(234,192,132,.2),inset 0 0 22px rgba(213,151,73,.07),0 6px 14px rgba(0,0,0,.28)}
.content--home .feature::before{opacity:1;inset:0 0 0 19%;background-position:center 54%}
.content--home .feature::after{background:linear-gradient(90deg,rgba(9,15,20,.96) 0%,rgba(9,15,20,.89) 27%,rgba(9,15,20,.15) 70%,rgba(9,15,20,.3) 100%)}
.feature strong{font-size:18px;font-weight:500}
.feature .kicker{font-size:10px;letter-spacing:.13em;color:#e5bd82}
.feature__arrow,.workspace-entry__chevron{width:27px;height:30px;background:rgba(11,16,20,.18);color:#f0c88c}
.feature__arrow svg,.workspace-entry__chevron svg{width:22px;height:22px}
.home-notice-head{display:flex;align-items:center;gap:7px;margin:22px 0 8px}
.home-notice-head h2{font-size:16px;font-weight:500;line-height:1.4;color:#f2dfbd}
.home-notice-head__icon{color:#d6af77;width:19px;height:20px;display:grid;place-items:center}
.home-notice-head__icon svg{height:18px;width:18px}
.home-notice-head__all{margin-left:auto;min-height:36px;display:flex;align-items:center;gap:4px;background:none;border:0;color:#e8d6b9;font-size:11px;padding:4px 0 4px 10px}
.notice--home{margin:0;border-radius:0;background:rgba(19,24,28,.82);box-shadow:none;border-color:rgba(208,183,149,.19)}
.notice--home:first-of-type{border-radius:9px 9px 0 0}
.notice--home:last-of-type{border-radius:0 0 9px 9px}
.notice--home + .notice--home{border-top:0}
.notice--home .notice-button{min-height:43px;padding:7px 10px;gap:8px;display:flex;align-items:center}
.notice--home .notice-badge{flex:none;min-width:51px;max-width:58px;text-align:center;font-size:10px;padding:3px 5px;line-height:1.35;border-radius:5px;color:#eed5ac;background:rgba(136,112,84,.40);border:1px solid rgba(181,149,106,.30)}
.notice--home .notice-badge--important{background:rgba(119,54,45,.63);border-color:rgba(211,121,100,.25)}
.notice--home .notice-badge--carriage{background:rgba(59,79,101,.7);border-color:rgba(115,147,175,.27)}
.notice--home .notice-home-title{min-width:0;flex:1;font-size:12px;color:#f0e7dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.notice--home .chevron{flex:none;font-size:18px;line-height:1;color:#dbb47c}
.notice--home .notice-content{font-size:13px}
.feature--news-empty{margin-top:5px;height:93px!important}
.demo-note{font-size:11px;line-height:1.45;opacity:.84}
/* Carriage: show a compact full six-week grid above fixed navigation. */
.hero.hero--seamless.hero--carriage{min-height:200px;padding:18px 15px 17px}
.hero.hero--seamless.hero--officer{min-height:209px;padding:18px 15px 19px}
.hero.hero--seamless.hero--news,.hero.hero--seamless.hero--survey{min-height:145px}
.hero--seamless .hero__copy{gap:12px}
.hero--seamless h1{font-size:22px;text-shadow:0 3px 10px #000}
.hero--seamless .hero__eyebrow{font-size:11px;letter-spacing:.14em}
.hero--seamless .hero__symbol{width:42px;height:42px;color:#edc388}
.hero--officer .officer-flag{position:absolute;right:29px;top:34px;width:58px;height:75px;object-fit:contain;filter:drop-shadow(0 8px 7px #0009);opacity:.86;pointer-events:none}
.content--calendar{padding-left:14px;padding-right:14px}
.month{margin:4px 0 12px;gap:12px}
.month strong{font-size:23px;color:#edc590;letter-spacing:.09em}
.month button{height:37px;width:37px;border-radius:7px;background:rgba(19,24,28,.80);border-color:rgba(210,172,118,.38);font-size:26px;box-shadow:inset 0 1px 2px rgba(255,255,255,.1)}
.calendar{background:rgba(13,17,20,.70);border-color:rgba(185,165,143,.32);border-radius:9px;box-shadow:0 12px 23px rgba(0,0,0,.25)}
.weekday{font-size:12px;padding:7px 0;line-height:1.5;background:rgba(42,44,45,.62)}
.day{height:59px;min-height:59px;padding:3px 2px 3px}
.day .date{font-size:15px;line-height:1.1;padding-left:2px}
.day .who{margin-top:4px;min-height:25px;max-height:29px;padding:2px 1px;font-size:9.5px;line-height:1.1;border-radius:5px;background:rgba(15,20,24,.52)}
.day .who-text{line-height:1.15;max-height:2.3em}
.day.today{box-shadow:inset 0 0 0 2px #edc580,inset 0 0 11px rgba(231,178,99,.38);border-radius:3px}
.day.sat{background-color:rgba(58,81,108,.33)}
.day.sun{background-color:rgba(110,52,49,.34)}
.content--calendar .legend,.content--calendar .calendar-help,.content--calendar .demo-note{margin-top:9px;font-size:10px}
/* Officer workspace: larger continuous castle hero, compact ornamental cards. */
.content--officer{padding-top:4px}
.workspace-entry{border-radius:13px;margin-bottom:17px;border:1px solid rgba(215,172,102,.70);box-shadow:inset 0 0 0 1px rgba(235,191,126,.14),0 9px 18px rgba(0,0,0,.3)}
.workspace-entry--tasks{height:208px}
.workspace-entry--manual,.workspace-entry--decisions{height:113px}
.workspace-entry__heading{left:18px;top:25px;gap:12px}
.workspace-entry__heading strong{font-size:20px}
.workspace-entry__heading small{font-size:10px}
.workspace-entry__chevron{top:29px;right:8px}
.workspace-entry__art{opacity:1}
.workspace-entry--tasks .workspace-entry__art{height:126px;background-position:66% 55%;background-size:cover}
.workspace-entry--tasks .workspace-entry__art::after{background:linear-gradient(90deg,#11171b 0%,rgba(17,23,27,.85) 33%,rgba(17,23,27,.07) 77%,rgba(17,23,27,.25) 100%)}
.workspace-entry--manual .workspace-entry__art::after,.workspace-entry--decisions .workspace-entry__art::after{background:linear-gradient(90deg,#11181d 0%,rgba(17,24,29,.84) 32%,rgba(17,24,29,.18) 77%,rgba(17,24,29,.1) 100%)}
.workspace-entry--manual .workspace-entry__art{background-position:right center}
.workspace-entry--decisions .workspace-entry__art{background-position:right center}
.work-stats{bottom:11px;left:11px;right:11px;gap:6px}
.work-stat{min-height:68px;padding:5px 1px;border-radius:8px}
.work-stat span{font-size:10px;letter-spacing:0;white-space:nowrap}
.work-stat strong{font-size:25px}
/* Navigation matches the continuous black/glass bar with a single gold active indicator. */
.bottom{background:linear-gradient(180deg,rgba(16,19,21,.94),rgba(9,13,16,.98));border-top:1px solid rgba(207,181,140,.26);padding:4px 5px calc(5px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
.bottom button{min-height:58px;font-size:10px;border-right:0;gap:2px}
.bottom .ico{height:26px;width:26px}
.bottom .ico svg{width:24px;height:24px}
.bottom button.active::before{top:-5px;width:72%;height:2px;box-shadow:0 0 11px rgba(233,185,104,.9)}
.bottom button.active{background:linear-gradient(180deg,rgba(223,166,89,.21),rgba(223,166,89,.02))}
/* Keep lite mode readable while retaining the photographic top section. */
:root[data-theme=light] .app{background-image:linear-gradient(180deg,rgba(9,13,17,.20) 0%,rgba(9,13,17,.25) 240px,rgba(243,238,230,.64) 530px,var(--bg) 870px),var(--page-photo)}
:root[data-theme=light] .app[data-page=carriage]{background-image:linear-gradient(180deg,rgba(9,13,17,.25),rgba(9,13,17,.45) 220px,rgba(243,238,230,.8) 500px,var(--bg) 850px),var(--page-photo)}
:root[data-theme=light] .notice--home{background:rgba(255,250,240,.93)}
:root[data-theme=light] .notice--home .notice-home-title{color:#343536}
:root[data-theme=light] .home-notice-head h2{color:#35302a}
:root[data-theme=light] .home-notice-head__all{color:#5f4a30}
:root[data-theme=light] .notice--home .chevron{color:#8f602c}
@media(max-width:360px){
 .home-stage{min-height:330px;padding-top:46px}
 .home-stage__crest{width:83px;height:95px}
 .home-stage__title{font-size:29px}
 .content--home .feature{height:111px}
 .notice--home .notice-button{min-height:42px}
 .notice--home .notice-home-title{font-size:11px}
 .hero.hero--seamless.hero--carriage{min-height:187px}
 .hero.hero--seamless.hero--officer{min-height:197px}
 .hero--seamless h1{font-size:19px}
 .day{height:56px;min-height:56px}
 .day .date{font-size:14px}
 .day .who{font-size:8.5px;max-height:27px;min-height:23px;margin-top:3px}
 .workspace-entry--tasks{height:195px}
 .workspace-entry--manual,.workspace-entry--decisions{height:108px}
 .work-stat span{font-size:9px}
 .work-stat strong{font-size:22px}
}
/* Visual review refinements after dark/light screenshots. */
.home-stage{min-height:403px;padding-top:76px}
.app[data-page=carriage]{background-size:100% 100%,118% auto;background-position:center top,center 79px}
.hero.hero--seamless.hero--carriage{min-height:211px}
.hero--officer .officer-flag{right:22px;top:70px;width:68px;height:91px;opacity:.8}
:root[data-theme=light] .app,
:root[data-theme=light] .app[data-page=carriage],
:root[data-theme=light] .app[data-page=officer]{background-size:100% 100%,100% 100%;}
@media(max-width:360px){.home-stage{min-height:379px;padding-top:68px}}

/* v2.5 HOME refinements: compact 70% KV and settings affordance.
   Keep the approved connected page imagery and existing navigation / data behavior. */
.home-stage{
  min-height:282px;
  padding:56px 18px 12px;
}
.home-stage__crest{
  width:74px;
  height:83px;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.23));
}
.home-stage__title{
  font-size:clamp(26px,6.8vw,34px);
  letter-spacing:.047em;
  line-height:1.12;
  margin:9px 0 7px;
}
.home-stage__subtitle{font-size:11px;letter-spacing:.055em}
.home-stage__ornament{margin-top:10px;height:8px;width:142px}
.home-menu-controls .menu-toggle{display:grid;place-items:center}
.home-menu-controls .menu-toggle svg,.header-menu-controls .menu-toggle svg{display:block}
@media(max-width:360px){
 .home-stage{min-height:265px;padding:52px 12px 9px}
 .home-stage__crest{width:68px;height:77px}
 .home-stage__title{font-size:26px;margin:8px 0 6px}
 .home-stage__subtitle{font-size:10px}
 .home-stage__ornament{margin-top:9px}
}

/* v2.6 HOME refinements (2026-11-22)
   Keep the 44px tap targets, but show only the gold settings glyph.
   Raise the whole crest/title/description/ornament by ~24px while keeping
   the KV height fixed, expanding the breathing room above the carriage card. */
.home-menu-controls .menu-toggle,
.header-menu-controls .menu-toggle{
  background:transparent;
  border:0;
  border-radius:0;
  box-shadow:none;
  width:44px;
  height:44px;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
.home-menu-controls .menu-toggle:hover,
.header-menu-controls .menu-toggle:hover,
.home-menu-controls .menu-toggle:active,
.header-menu-controls .menu-toggle:active{
  background:transparent;
  border:0;
  box-shadow:none;
}
.home-stage__center{transform:translateY(-24px)}
@media(max-width:360px){
  .home-stage__center{transform:translateY(-22px)}

const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function theme(){document.documentElement.dataset.theme=pref==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):pref;}
function toast(message){const x=document.createElement('div');x.className='toast';x.textContent=message;document.body.append(x);setTimeout(()=>x.remove(),2400);}
function toggleMenu(){menuOpen=!menuOpen;render();}
function makeHeader(){return `<header class="header"><img class="crest" src="${CREST}" alt="ギルドエンブレム"><div class="brand">オウマガトキ<small>GUILD PORTAL</small></div><button class="menu-toggle" type="button" onclick="toggleMenu()" aria-label="メニュー" aria-expanded="${menuOpen}">☰</button>${menuOpen?`<div class="menu"><button type="button" onclick="openSettings()">表示設定</button><button type="button" onclick="swapRole()">${role==='officer'?'一般メンバー':'幹部'}表示に切り替え（デモ）</button><button type="button" onclick="toast('アカウント機能は未実装です')">アカウント設定（準備中）</button></div>`:''}</header>`;}
function accordion(n){return `<article class="notice"><button class="notice-button" aria-expanded="${!!n.open}" onclick="toggleNotice(${n.id})"><span><span class="notice-meta">${e(n.date)} <b>${e(n.category)}</b> ${n.pin?'★ 重要':''}</span><span class="notice-title">${e(n.title)}</span></span><span class="chevron">${n.open?'⌃':'⌄'}</span></button>${n.open?`<div class="notice-content">${e(n.body)}<div class="notice-actions"><button class="mini" onclick="copyNotice(${n.id})">本文をコピー</button>${n.confirm?`<button class="mini" onclick="confirmNotice(${n.id})">${n.confirmed?'✓ 確認済み':'確認しました'}</button>`:''}${role==='officer'?`<button class="mini" onclick="editNotice(${n.id})">編集</button>`:''}</div></div>`:''}</article>`;}
function toggleNotice(id){const n=notices.find(x=>x.id===id);if(n){n.open=!n.open;render();}}
function confirmNotice(id){const n=notices.find(x=>x.id===id);if(!n)return;n.confirmed=!n.confirmed;render();toast(n.confirmed?'確認済みにしました（デモ）':'確認を解除しました');}
function copyNotice(id){const n=notices.find(x=>x.id===id);if(!n)return; if(navigator.clipboard?.writeText){navigator.clipboard.writeText(n.body).then(()=>toast('本文をコピーしました')).catch(()=>toast('コピーできませんでした'));}else{const a=document.createElement('textarea');a.value=n.body;document.body.append(a);a.select();try{document.execCommand('copy');toast('本文をコピーしました');}catch(err){toast('コピーできませんでした');}a.remove();}}
function newsPage(){const list=activeNotices().filter(n=>newsCategory==='すべて'||n.category===newsCategory).sort((a,b)=>Number(b.pin)-Number(a.pin)||b.date.localeCompare(a.date));return `${hero('お知らせ','GUILD NOTICES')}<main class="content"><div class="label-row"><h2>お知らせ一覧</h2>${role==='officer'?'<button class="goldbtn" onclick="editNotice(null)">＋ 投稿</button>':''}</div><div class="category-row">${['すべて','イベント','馬車','運営','その他'].map(c=>`<button class="${newsCategory===c?'active':''}" onclick="newsCategory='${c}';render()">${c}</button>`).join('')}</div>${list.map(accordion).join('')||'<p class="empty">該当するお知らせはありません</p>'}</main>`;}
function fakeName(y,m,d){return sampleNames[Math.abs(y*13+m*5+d*7)%sampleNames.length];}
function moveMonth(n){const d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth();render();}
function docCards(kind){return `<div class="label-row"><h2>${kind==='manual'?'マニュアル':'決定事項'}</h2><button class="goldbtn" onclick="editDoc('${kind}',-1)">＋ 作成</button></div>${docs[kind].map((d,i)=>`<button class="doc-card" onclick="showDoc('${kind}',${i})"><strong>${e(d.title)}</strong><p>${e(d.body).slice(0,95)}</p></button>`).join('')}`;}
function surveyPage(){return `${hero('アンケート','GUILD SURVEYS')}<main class="content"><div class="card empty" style="padding:50px 20px"><h2>準備中</h2><p class="note">アンケート機能は後続フェーズで実装します。</p></div></main>`;}
function render(){theme();document.getElementById('app').innerHTML=makeHeader()+(page==='home'?homePage():page==='news'?newsPage():page==='carriage'?calendarPage():page==='officer'&&role==='officer'?officerPage():surveyPage())+makeNav()+(modal?modalUI():'');}
function closeModal(){modal=null;render();}
function openSettings(){menuOpen=false;modal={type:'settings'};render();}
function editNotice(id){modal={type:'noticeEdit',id};render();}
function showTask(id){modal={type:'taskView',id};render();}
function editTask(id){const t=tasks.find(x=>x.id===id);photoDraft=[...(t?.images||[])];modal={type:'taskEdit',id};render();}
function showDoc(kind,i){modal={type:'docView',kind,i};render();}
function editDoc(kind,i){photoDraft=[...(docs[kind][i]?.images||[])];modal={type:'docEdit',kind,i};render();}
function openTrash(){modal={type:'trash'};render();}
function confirmDelete(id){modal={type:'deleteConfirm',id};render();}
function deleteTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;t.deleted=true;closeModal();toast('ゴミ箱へ移動しました（デモ）');}
function restoreTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;t.deleted=false;render();toast('タスクを復元しました（デモ）');}
function photoUI(){return `<label class="formlabel">画像添付（複数枚可）</label><label class="upload-label">＋ スマホの写真ライブラリ・カメラ・ファイルから選択<input type="file" accept="image/*" multiple onchange="addPhotos(event)"></label><p id="photo-count" class="note">${photoDraft.length}枚選択中（共有保存されません）</p><div id="photo-preview" class="uploads">${photoDraft.map((src,i)=>`<img class="thumb" src="${src}" alt="添付${i+1}">`).join('')}</div>`;}
async function addPhotos(event){for(const file of Array.from(event.target.files).slice(0,12)){if(!file.type.startsWith('image/'))continue;const src=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file);});photoDraft.push(src);}const count=document.getElementById('photo-count'),prev=document.getElementById('photo-preview');if(count)count.textContent=photoDraft.length+'枚選択中（共有保存されません）';if(prev)prev.innerHTML=photoDraft.map((src,i)=>`<img class="thumb" src="${src}" alt="添付${i+1}">`).join('');}
function thumbs(images){return images?.length?`<div class="uploads">${images.map((src,i)=>`<button class="mini" onclick="showGallery('${modal.type}',${i})"><img class="thumb" src="${src}" alt="添付画像 ${i+1}"></button>`).join('')}</div>`:'';}
function showGallery(from,i){galleryImages=from==='taskView'?tasks.find(t=>t.id===modal.id).images:from==='docView'?docs[modal.kind][modal.i].images:photoDraft;galleryIndex=i;modal={type:'gallery'};render();}
function swipeStart(ev){touchX=ev.touches[0].clientX;}
function swipeEnd(ev){const d=ev.changedTouches[0].clientX-touchX;if(Math.abs(d)>45)moveGallery(d<0?1:-1);}
function moveGallery(n){galleryIndex=(galleryIndex+n+galleryImages.length)%galleryImages.length;render();}
function saveNotice(ev){ev.preventDefault();const v=new FormData(ev.target),n={title:v.get('title'),body:v.get('body'),category:v.get('category'),expires:v.get('expires'),home:v.has('home'),pin:v.has('pin'),confirm:v.has('confirm')};const old=notices.find(x=>x.id===modal.id);if(old)Object.assign(old,n);else notices.unshift({...n,id:Date.now(),date:new Date().toISOString().slice(0,10),open:false,confirmed:false});closeModal();toast('お知らせを更新しました（デモ）');}
function saveTask(ev){ev.preventDefault();const v=new FormData(ev.target),n={title:v.get('title'),members:v.get('members'),due:v.get('due'),priority:v.get('priority'),status:v.get('status'),memo:v.get('memo'),repeat:v.get('repeat'),images:[...photoDraft]};const old=tasks.find(x=>x.id===modal.id);if(old)Object.assign(old,n);else tasks.push({...n,id:Date.now(),deleted:false});taskFilter=n.status;closeModal();toast('タスクを更新しました（デモ）');}
function saveDoc(ev){ev.preventDefault();const v=new FormData(ev.target),n={title:v.get('title'),body:v.get('body'),images:[...photoDraft]};if(modal.i<0)docs[modal.kind].unshift(n);else docs[modal.kind][modal.i]=n;closeModal();toast('資料を更新しました（デモ）');}

 const wrap=s=>`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true">${s}</section></div>`;
 const m=modal;
 if(m.type==='settings')return wrap(`${head('表示設定')}<p class="note">初期表示は端末の設定に合わせます。</p><div class="actions">${[['auto','端末設定'],['dark','ダーク'],['light','ライト']].map(([key,label])=>`<button class="mini" onclick="pref='${key}';render()">${pref===key?'✓ ':''}${label}</button>`).join('')}</div><p class="note">権限の切り替えは表示確認用。実際のログインではありません。</p>`);
 if(m.type==='taskView'){const t=tasks.find(x=>x.id===m.id);return wrap(`${head('タスク詳細')}<h3>${e(t.title)}</h3><p class="note">${e(t.status)}　｜　優先度：${e(t.priority)}</p><p class="note">担当：${e(t.members||'未設定')}　期限：${e(t.due||'未設定')}</p><p class="readbody">${e(t.memo||'詳細メモはありません')}</p>${t.repeat!=='なし'?`<p class="note">定期設定：${e(t.repeat)}（自動生成は未実装）</p>`:''}${thumbs(t.images)}<div class="actions"><button class="danger" onclick="confirmDelete(${t.id})">削除</button><button class="goldbtn" onclick="editTask(${t.id})">編集</button></div>`);}
 if(m.type==='taskEdit'){const t=tasks.find(x=>x.id===m.id)||{title:'',members:'',due:'',priority:'中',status:'未着手',memo:'',repeat:'なし'};return wrap(`<form onsubmit="saveTask(event)">${head(m.id?'タスクを編集':'タスクを追加')}<label class="formlabel">タスク名</label><input required class="field" name="title" value="${e(t.title)}"><label class="formlabel">担当者（複数人可）</label><input class="field" name="members" value="${e(t.members)}" placeholder="例：RIN・TAKU"><div class="twocol"><div><label class="formlabel">期限</label><input class="field" type="date" name="due" value="${e(t.due)}"></div><div><label class="formlabel">優先度</label><select class="field" name="priority">${['高','中','低'].map(s=>`<option ${t.priority===s?'selected':''}>${s}</option>`).join('')}</select></div></div><label class="formlabel">ステータス</label><select class="field" name="status">${statuses.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select><label class="formlabel">詳細・メモ</label><textarea class="field" rows="8" name="memo">${e(t.memo)}</textarea><label class="formlabel">繰り返し（指定例）</label><select class="field" name="repeat">${['なし','毎週月曜日','毎週金曜日','毎月1日','毎月22日','毎月末日'].map(s=>`<option ${t.repeat===s?'selected':''}>${s}</option>`).join('')}</select><p class="note">実際の定期自動生成は本番環境で実装します。</p>${photoUI()}<div class="actions"><button class="goldbtn">保存（デモ）</button></div></form>`);}
 if(m.type==='deleteConfirm'){const t=tasks.find(x=>x.id===m.id);return wrap(`${head('削除の確認')}<p>「${e(t.title)}」をゴミ箱へ移動しますか？</p><p class="note">削除後もゴミ箱から復元できます。</p><div class="actions"><button class="mini" onclick="showTask(${t.id})">キャンセル</button><button class="danger" onclick="deleteTask(${t.id})">ゴミ箱へ移動</button></div>`);}
 if(m.type==='trash')return wrap(`${head('タスクのゴミ箱')}${tasks.filter(t=>t.deleted).map(t=>`<div class="doc-card"><strong>${e(t.title)}</strong><div class="actions"><button class="mini" onclick="restoreTask(${t.id})">復元</button></div></div>`).join('')||'<div class="empty">ゴミ箱は空です</div>'}`);
 if(m.type==='docView'){const d=docs[m.kind][m.i];return wrap(`${head(m.kind==='manual'?'マニュアル':'決定事項')}<h3>${e(d.title)}</h3><p class="readbody">${e(d.body)}</p>${thumbs(d.images)}<div class="actions"><button class="goldbtn" onclick="editDoc('${m.kind}',${m.i})">編集</button></div>`);}
 if(m.type==='docEdit'){const d=docs[m.kind][m.i]||{title:'',body:''};return wrap(`<form onsubmit="saveDoc(event)">${head(m.i<0?'資料を作成':'資料を編集')}<label class="formlabel">タイトル</label><input required name="title" class="field" value="${e(d.title)}"><label class="formlabel">内容</label><textarea name="body" class="field" rows="8">${e(d.body)}</textarea>${photoUI()}<div class="actions"><button class="goldbtn">保存（デモ）</button></div></form>`);}
 if(m.type==='gallery')return wrap(`${head('添付画像')}<div class="gallery" ontouchstart="swipeStart(event)" ontouchend="swipeEnd(event)"><img src="${galleryImages[galleryIndex]}" alt="添付画像"><div class="gallery-controls"><button class="mini" onclick="moveGallery(-1)">‹ 前へ</button><span class="note">${galleryIndex+1} / ${galleryImages.length}</span><button class="mini" onclick="moveGallery(1)">次へ ›</button></div></div>`);
 return wrap(head('設定'));
}

function v22HomeActive(n) {
  if (!n.home) return false;
  if (!n.expires) return true;
  const expires = String(n.expires);
  const end = new Date(expires.includes('T') ? expires : `${expires}T23:59:59`);
  return Number.isNaN(end.getTime()) || end >= new Date();
}

function calendarPage() {
  const first = (new Date(year, month, 1).getDay() + 6) % 7; // Monday first, approved image.
  const days = new Date(year, month + 1, 0).getDate();
  const rows = Math.ceil((first + days) / 7);
  const now = new Date();
  let cells = '';
  for (let i = 0; i < rows * 7; i++) {
    const day = i - first + 1;
    const date = new Date(year, month, day);
    const outside = day < 1 || day > days;
    const weekday = i % 7;
    const officer = !outside && day % 7 === 0; // Explicitly demonstrative, not real roster data.
    const today = !outside && year === now.getFullYear() && month === now.getMonth() && day === now.getDate();
    cells += `<div class="day ${outside ? 'out' : ''} ${weekday === 5 ? 'sat' : ''} ${weekday === 6 ? 'sun' : ''} ${today ? 'today' : ''}" ${today ? 'aria-current="date"' : ''}><span class="date">${date.getDate()}</span>${!outside ? `<span class="who ${officer ? 'leader' : ''}">${officer ? '<span aria-label="幹部（サンプル）">✦ </span>' : ''}${e(fakeName(year, month, day))}</span>` : ''}</div>`;
  }
  return `${hero('ギルド馬車', 'GUILD CARRIAGE')}<main class="content content--calendar">
    <div class="month"><button type="button" onclick="moveMonth(-1)" aria-label="前月へ"><span aria-hidden="true">‹</span></button><strong class="latin">${year}.${String(month + 1).padStart(2, '0')}</strong><button type="button" onclick="moveMonth(1)" aria-label="翌月へ"><span aria-hidden="true">›</span></button></div>
    <div class="calendar" role="group" aria-label="${year}年${month + 1}月の馬車当番表">${V22_WEEKDAYS.map((day, i) => `<div class="weekday ${i === 5 ? 'sat' : ''} ${i === 6 ? 'sun' : ''}">${day}</div>`).join('')}${cells}</div>
    <div class="legend"><span><i class="legend-dot"></i> 一般メンバー</span><span><i class="legend-dot legend-dot--leader"></i> 幹部（サンプル）</span></div>
    <p class="note demo-note">閲覧専用デモです。名前・幹部区分はサンプルであり、Googleスプレッドシートとは連携していません。</p>
  </main>`;
}

    <button type="button" class="feature feature--news" style="--photo:url('${SCENE_DESK}')" onclick="go('news')"><span class="feature__copy"><strong>お知らせ一覧</strong><span class="kicker">GUILD NOTICES</span></span><span class="feature__arrow">${v22Icon('chevron')}</span></button>
    <button type="button" class="feature feature--carriage" style="--photo:url('${SCENE_CARRIAGE}')" onclick="go('carriage')"><span class="feature__copy"><strong>ギルド馬車</strong><span class="kicker">GUILD CARRIAGE</span></span><span class="feature__arrow">${v22Icon('chevron')}</span></button>
    ${role==='officer'?`<button type="button" class="feature feature--officer" style="--photo:url('${SCENE_DESK}')" onclick="go('officer')"><span class="feature__copy"><strong>幹部ワークスペース</strong><span class="kicker">OFFICER WORKSPACE</span></span><span class="feature__arrow">${v22Icon('chevron')}</span></button>`:''}
    <p class="note demo-note">v2.3 操作デモ｜表示内容はサンプルです。共有保存や実データ連携はしていません。</p>
  </main>`;
}
function v23CalendarName(day){return year===2026 && month===10 && day===12?'ダークシャドウナイト':fakeName(year,month,day)}
function showCarriageName(day){
  const name=v23CalendarName(day);
  modal={type:'carriageName',day,name,officer:day%7===0};
  render();
}
function calendarPage(){
  const first=(new Date(year,month,1).getDay()+6)%7;
  const days=new Date(year,month+1,0).getDate();
  const rows=Math.ceil((first+days)/7);
  const now=new Date();
  let cells='';
  for(let i=0;i<rows*7;i++){
    const day=i-first+1,dt=new Date(year,month,day),out=day<1||day>days,weekday=i%7,officer=!out&&day%7===0;
    const today=!out&&year===now.getFullYear()&&month===now.getMonth()&&day===now.getDate();
    const name=v23CalendarName(day);
    cells+=`<div class="day ${out?'out':''} ${weekday===5?'sat':''} ${weekday===6?'sun':''} ${today?'today':''}" ${today?'aria-current="date"':''}><span class="date">${dt.getDate()}</span>${out?'':`<button type="button" class="who ${officer?'leader':''}" onclick="showCarriageName(${day})" aria-label="${month+1}月${day}日 担当者 ${e(name)} の詳細を表示" title="${e(name)}"><span class="who-text">${officer?'✦ ':''}${e(name)}</span></button>`}</div>`;
  }
  return `${hero('ギルド馬車','GUILD CARRIAGE')}<main class="content content--calendar"><div class="month"><button type="button" onclick="moveMonth(-1)" aria-label="前月へ">‹</button><strong class="latin">${year}.${String(month+1).padStart(2,'0')}</strong><button type="button" onclick="moveMonth(1)" aria-label="翌月へ">›</button></div><div class="calendar" role="group" aria-label="${year}年${month+1}月の馬車当番表">${V22_WEEKDAYS.map((day,i)=>`<div class="weekday ${i===5?'sat':''} ${i===6?'sun':''}">${day}</div>`).join('')}${cells}</div><div class="legend"><span><i class="legend-dot"></i> 一般メンバー</span><span><i class="legend-dot legend-dot--leader"></i> 幹部（サンプル）</span></div><p class="calendar-help">長い名前は2行で省略表示。名前をタップすると全文を確認できます。</p><p class="note demo-note">閲覧専用デモです。名前・幹部区分はサンプルで、Googleスプレッドシートとは連携していません。</p></main>`;
}
const v23OldModalUI=modalUI;
modalUI=function(){
  if(modal?.type!=='carriageName')return v23OldModalUI();
  return `<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal carriage-person-dialog" role="dialog" aria-modal="true" aria-label="馬車担当者"><div class="modal-head"><h2>馬車担当者</h2><button type="button" onclick="closeModal()">閉じる ×</button></div><p class="carriage-person-date latin">${year}.${String(month+1).padStart(2,'0')}.${String(modal.day).padStart(2,'0')}</p><p class="carriage-person-name">${e(modal.name)}</p><p class="note">${modal.officer?'幹部（サンプル）':'一般メンバー（サンプル）'}</p></section></div>`;
};
render();

 return `<article class="notice notice--home"><button type="button" class="notice-button" aria-expanded="${!!n.open}" onclick="toggleNotice(${n.id})"><span class="notice-badge ${klass}">${e(badge)}</span><span class="notice-home-title">${e(n.title)}</span><span class="chevron" aria-hidden="true">${n.open?'⌃':'⌄'}</span></button>${n.open?`<div class="notice-content">${e(n.body)}<div class="notice-actions"><button class="mini" onclick="copyNotice(${n.id})">本文をコピー</button>${n.confirm?`<button class="mini" onclick="confirmNotice(${n.id})">${n.confirmed?'✓ 確認済み':'確認しました'}</button>`:''}${role==='officer'?`<button class="mini" onclick="editNotice(${n.id})">編集</button>`:''}</div></div>`:''}</article>`;
}

  <p class="note demo-note">v2.6 操作デモ｜サンプルデータです。実ログイン・共有保存・外部連携は未実装です。</p>
